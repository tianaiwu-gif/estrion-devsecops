apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: estrion-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tianaiwu-gif/estrion-devsecops.git
    targetRevision: main
    path: helm/estrion-app
    helm:
      releaseName: estrion-app
  destination:
    server: https://kubernetes.default.svc
    namespace: estrion-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true



